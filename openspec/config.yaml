schema: spec-driven
context: |
  Repository: SamuelAsherRivello/babylon-lite-street-fighter-clone, a React/Vite
  browser fighting game using @babylonjs/lite 1.32.0 and WebGPU.
  Repository root is the npm root; street-fighter-ii/ is the Vite app, source,
  tests, canonical documentation assets, and production build root.
  Use a 4:3 landscape playfield with Babylon Lite's DPR-aware canvas and the
  template's nearest-filtered, no-mipmap, msaaSamples:1 pixel-art path. The
  app owns simulation and input; React owns menus/HUD; online outcomes must be
  server-authoritative through the shared Colyseus server.
  Commands from repository root: npm ci, npm run dev, npm test, npm run build.
  GitHub Pages base is /babylon-lite-street-fighter-clone/ and publishes
  street-fighter-ii/dist/. Version source is version.txt.
  Shared server checkout is ../server at revision d590b1bd9fe3dbb56302fed120477821e41c9b8e,
  latest released contract is 0.7.0; it currently creates coded private rooms
  for Gungeon but reconnect creates a fresh identity. Server runs Node 24.x,
  in-memory state on Vercel Hobby with possible cross-instance routing gaps and
  resets around its function-duration limit. Do not claim durable sessions.
  OpenSpec CLI and generated skills are pinned to 1.13.1. Preserve generated
  skills and template corner roles, version source, fullscreen storage, and
  protected links. No pull request unless requested.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

